<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Freestyle Lightbox</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 10000;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.95);
    }

    .lightbox-content {
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      max-width: 90%;
      margin: auto;
    }

    .slide {
      display: none;
    }

    .slide.active {
      display: block;
    }

    .slide img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 10px;
    }

    .slide figcaption {
      margin-top: 0.5em;
      font-size: 1rem;
      color: #ddd;
    }

    .prev, .next, .close {
      position: absolute;
      color: white;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      padding: 0.5rem 1rem;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
    }

    .close {
      top: 1rem;
      right: 2rem;
    }

    .prev {
      top: 50%;
      left: 2%;
      transform: translateY(-50%);
    }

    .next {
      top: 50%;
      right: 2%;
      transform: translateY(-50%);
    }

    .prev:hover, .next:hover, .close:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    a {
      color: #66ccff;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h3>Update</h3>
  <ul class="freestyle-notes">
    <li>I was ranked 7th in the 2025 Canadian freestyle soccer championship!</li>
  </ul>

  <a href="#" onclick="openLightbox(); return false;">Click to see photos</a>

  <div id="lightbox" class="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <span class="prev" onclick="changeSlide(-1)">&#10094;</span>
    <span class="next" onclick="changeSlide(1)">&#10095;</span>

    <div class="lightbox-content">
      <div class="slide active">
        <img src="https://via.placeholder.com/800x500?text=Ollie">
        <figcaption>2x Canadian champ Ollie</figcaption>
      </div>
      <div class="slide">
        <img src="https://via.placeholder.com/800x500?text=7th+Place">
        <figcaption>7th in Canada baby</figcaption>
      </div>
      <div class="slide">
        <img src="https://via.placeholder.com/800x500?text=Final+Trick">
        <figcaption>Final trick attempt</figcaption>
      </div>
    </div>
  </div>

  <script>
    let currentSlide = 0;

    function openLightbox() {
      document.getElementById("lightbox").style.display = "block";
      showSlide(currentSlide);
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }

    function changeSlide(n) {
      currentSlide += n;
      const slides = document.querySelectorAll(".slide");
      if (currentSlide >= slides.length) currentSlide = 0;
      if (currentSlide < 0) currentSlide = slides.length - 1;
      showSlide(currentSlide);
    }

    function showSlide(index) {
      const slides = document.querySelectorAll(".slide");
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === index);
      });
    }
  </script>

</body>
</html>
